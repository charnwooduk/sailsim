# Runs the simulator's own acceptance suite on every push and pull request, so
# a change that stops the boat behaving like a boat cannot land quietly.
#
# The expectations are not duplicated here — they live in ssim.html §11, and
# tools/selftest.js only drives a headless browser at ssim.html?selftest and
# reads the table it prints.

name: Acceptance suite

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package.json

      - name: Install the runner
        working-directory: tools
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        working-directory: tools
        run: npx playwright install --with-deps chromium

      - name: Run the acceptance suite
        working-directory: tools
        run: node selftest.js
